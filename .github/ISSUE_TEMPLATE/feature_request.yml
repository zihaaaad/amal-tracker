name: Feature Request
description: Propose a functional enhancement for the platform.
labels: ["enhancement"]
body:
  - type: textarea
    id: problem-description
    attributes:
      label: Problem Description
      description: Provide a clear and concise description of the functional gap.
      placeholder: Describe the current limitation.
    validations:
      required: true
  - type: textarea
    id: proposed-solution
    attributes:
      label: Proposed Solution
      description: Provide a clear and concise description of the requested enhancement.
    validations:
      required: true
  - type: textarea
    id: alternative-solutions
    attributes:
      label: Alternative Solutions
      description: Describe any alternative solutions or features that were considered.
  - type: textarea
    id: implementation-context
    attributes:
      label: Implementation Context
      description: Provide any additional context or technical considerations for the enhancement.
