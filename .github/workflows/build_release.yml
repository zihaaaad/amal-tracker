name: Build and Release Flutter APKs

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Run Build Runner
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Analyze Code
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      # ── Build Client APK ───────────────────────────────────────────
      - name: Build Client APK
        run: flutter build apk --release -t lib/main_client.dart --flavor client || flutter build apk --release -t lib/main_client.dart

      - name: Rename Client APK
        run: mv build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/Amal_Tracker_Client.apk || mv build/app/outputs/flutter-apk/app-client-release.apk build/app/outputs/flutter-apk/Amal_Tracker_Client.apk

      # ── Build Admin APK ────────────────────────────────────────────
      - name: Build Admin APK
        run: flutter build apk --release -t lib/main_admin.dart --flavor admin || flutter build apk --release -t lib/main_admin.dart

      - name: Rename Admin APK
        run: mv build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/Amal_Tracker_Admin.apk || mv build/app/outputs/flutter-apk/app-admin-release.apk build/app/outputs/flutter-apk/Amal_Tracker_Admin.apk

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Amal-Tracker-APKs
          path: |
            build/app/outputs/flutter-apk/Amal_Tracker_Client.apk
            build/app/outputs/flutter-apk/Amal_Tracker_Admin.apk

      - name: Create GitHub Release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Release v1.0.${{ github.run_number }}
          files: |
            build/app/outputs/flutter-apk/Amal_Tracker_Client.apk
            build/app/outputs/flutter-apk/Amal_Tracker_Admin.apk
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
