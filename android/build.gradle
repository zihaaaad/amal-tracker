allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

def newBuildDir = rootProject.layout.buildDirectory.dir("../../build").get()
rootProject.layout.buildDirectory.value(newBuildDir)

subprojects {
    def newSubprojectBuildDir = newBuildDir.dir(project.name)
    project.layout.buildDirectory.value(newSubprojectBuildDir)
}

// Fix for old plugins (like isar_flutter_libs) missing a namespace.
// AGP 8.x requires all library modules to have a namespace.
// Also fix AAPT: error: resource android:attr/lStar not found by forcing compileSdk to 34.
// This must run BEFORE evaluationDependsOn to catch modules pre-evaluation.
subprojects {
    plugins.withId("com.android.library") {
        android {
            if (namespace == null || namespace.isEmpty()) {
                namespace = project.group?.toString()
                if (namespace == null || namespace.isEmpty()) {
                    namespace = "dev.flutter.${project.name.replace('-', '_')}"
                }
            }
            compileSdk = 34
        }
    }
}

subprojects {
    project.evaluationDependsOn(":app")
}

tasks.register("clean", Delete) {
    delete rootProject.layout.buildDirectory
}
