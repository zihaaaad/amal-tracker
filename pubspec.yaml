name: amal_tracker
description: "Premium Islamic daily practices tracker with offline-first architecture."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State Management
  flutter_riverpod: ^2.6.1

  # Backend & Auth
  supabase_flutter: ^2.9.0

  # Local Database
  shared_preferences: ^2.3.4
  path_provider: ^2.1.4

  # Background & Notifications
  workmanager: ^0.9.0
  flutter_local_notifications: ^18.0.1

  # PDF Generation
  pdf: ^3.11.1
  printing: ^5.13.3

  # UI Enhancements
  flutter_staggered_grid_view: ^0.7.0
  fl_chart: ^0.69.2
  google_fonts: ^6.2.1
  flutter_animate: ^4.5.2

  # Utilities
  intl: ^0.20.2
  share_plus: ^10.1.4
  permission_handler: ^11.4.0
  uuid: ^4.5.1
  confetti: ^0.8.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
