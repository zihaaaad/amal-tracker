name: amal_tracker
description: "Islamic daily practices tracker — offline-first, lite, and fast."
publish_to: 'none'
version: 1.1.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State Management
  flutter_riverpod: ^2.6.1

  # Backend & Auth
  supabase_flutter: ^2.9.0

  # Local Storage
  shared_preferences: ^2.3.4
  isar: ^3.1.0+1
  isar_flutter_libs: ^3.1.0+1
  path_provider: ^2.1.5

  # Background & Notifications
  workmanager: ^0.9.0
  flutter_local_notifications: ^18.0.1

  # PDF Generation
  pdf: ^3.11.1
  printing: ^5.13.3

  # UI
  fl_chart: ^0.69.2
  google_fonts: ^6.2.1

  # Utilities
  intl: ^0.20.2
  permission_handler: ^11.4.0
  confetti: ^0.8.0
  flutter_slidable: ^4.0.3
  timezone: ^0.10.1
  flutter_timezone: ^5.0.2
  local_auth: ^2.1.6
  flutter_animate: ^4.5.2
  uuid: ^4.5.1
  package_info_plus: ^10.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  isar_generator: ^3.1.0+1
  build_runner: ^2.4.13

flutter:
  uses-material-design: true
